<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="author" content="Douglas Crockford" />
<title>The Misty Parse Demo</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" type="text/css" href="../misty.css">
<style>
input[type=button] {
    border: 2pt solid black;
    border-radius: 2em;
    font-family: Programma, monospace;
    font-size: 100%;
    margin: 0.5em;
    padding: 0.5em;
}
input[type=button]:hover {
    background-color: thistle;
}
textarea {
    border: 0;
    width: 100%;
}
pre > h4 {
    margin-left: -2em;
}
pre {
    margin-left: 2em;
    white-space: pre-wrap;
}
#outputation {
    text-indent: 4em hanging each-line;
}
</style>
</head>
<body>
<img src="../misty.gif" width="204" height="79">
<h1><a href="https://mistysystem.com/">Misty Programming Language:</a>The Misty Parse Demo</h1>
<p>Put misty source text in the box and push a button.</p>
<fieldset style="clear: both;">
<legend>Source text</legend>
<textarea
    autocomplete=off
    autocorrect=off
    autofocus=on
    id="inputation"
    placeholder="misty program..."
    rows=24
    spellcheck=false
    wrap=off
>
</textarea>
</fieldset>
<fieldset style="clear: both;">
<legend>Endowments</legend>
<textarea
    autocomplete=off
    autocorrect=off
    autofocus=off
    id="endowments"
    placeholder="Endoowment JSON"
    rows=2
    spellcheck=false
    wrap=on
>
</textarea>
</fieldset>
<fieldset style="clear: both;">
<legend>Logs</legend>
<textarea
    autocomplete=off
    autocorrect=off
    autofocus=on
    id="logs"
    placeholder="Log Access JSON"
    rows=2
    spellcheck=false
    wrap=on
>
</textarea>
</fieldset>
<p style="text-align: center;">

<input id=clear_button type=button value="clear">
<input id=token_button type=button value="tokens">
<input id=parse_button type=button value="parse">
<input id=extra_button type=button value="extra">
<input id=complete type=button value="complete">
<input id=debugger type=button value="debugger">

</p>
<fieldset><legend id=output_legend>Watch this space</legend>
<pre id=outputation style="clear: both;"></pre></fieldset>

<script type="module">
import tokenize from "../js/tokenize.js";
import parse from "../js/parse.js";
import scope from "../js/scope.js";
import slot from "../js/slot.js";

const end_of_line = "\n";

function escapify(text) {
    return "\"" + text.replace(/\\/g, "\\b").replace(/"/g, "\\q")  + "\"";
}

var indentation = 0;
var output = undefined;
var endowment_box;
var log_box;

function begin_emit() {
    indentation = 0;
    output = [];
}

function end_emit() {
    return output.join("");
}

function emit_full_name(token) {
    if (typeof token.make === "string") {
        emit(token.make + " ");
    }
    emit(token.text);
    if (typeof token.function_nr === "number") {
        emit(" ƒ" + token.function_nr);
    }
    if (typeof token.slot === "number") {
        emit("." + token.slot);
    }
    if (typeof token.level === "number" && token.level > 0) {
        emit(" ↑" + token.level);
    }
    if (token.closure === true) {
        emit(" closure");
    }
}

function emit(token) {
    if (token === undefined) {
        emit(end_of_line);
        emit(" ".repeat(indentation));
    } else if (typeof token === "string") {
        output.push(token);
    } else if (Array.isArray(token)) {
        token.forEach(function (arg, arg_nr) {
            if (arg_nr !== 0) {
                emit(" ");
            }
            return emit(arg);
        });
    } else if (token.kind === "text") {
        emit(escapify(token.text));
    } else if (token.kind === "number" || token.kind === "apostrophic") {
        emit(token.text);
    } else {
        if (token.kind === "name") {
            emit(token.text);
            if (typeof token.function_nr === "number") {
                emit("ƒ"+ token.function_nr);
            }
            if (typeof token.slot === "number") {
                emit("." + token.slot);
            }
        } else if (token.kind === "infix") {
            emit("(");
            token.operators.forEach(function (operator, operator_nr) {
                emit(token.operands[operator_nr]);
                emit(" ");
                emit(operator.text);
                emit(" ");
            });
            emit(token.operands[token.operators.length]);
            emit(")");
        } else if (token.kind === "function") {
            emit("ƒ" + token.function_nr);
        } else if (token.kind === "array") {
            emit("[");
            emit(token.first);
            emit("]");
        } else if (token.kind === "record") {
            emit("{");
            token.first.forEach(function (field, field_nr) {
                if (field_nr !== 0) {
                    emit(" ");
                }
                emit(escapify(field.text));
                emit(": ");
                emit(token.second[field_nr]);
            });
            emit("}");
        } else if (token.kind === "endowment") {
            emit("*endowment*");
        } else if (token.kind === "module") {
            emit("module");
            emit(" ");
            emit(token.first);
        } else if (token.text === "[") {
            emit(token.first);
            emit("[");
            emit(token.second);
            emit("]");
        } else if (token.text === "[]") {
            emit("[]");
        } else if (token.text === "(") {
            emit(token.first);
            emit("(");
            if (token.second && token.second.length > 0) {
                emit(token.second)
            }
            emit(")");
        } else if (token.text === "then") {
            emit("(");
            emit(token.first);
            emit(" then ");
            emit(token.second);
            emit(" else ");
            emit(token.third);
            emit(")");
        } else {
            emit(token.text);
            emit("????");
        }
    }
}

function emit_statement(token) {
    if (token.kind === "name") {
        emit();
        emit(token.text);
        if (token.first) {
            emit(" ");
            if (token.push) {
                emit("[]");
            }
            if (token.status) {
                emit(token.status);
                emit(" ");
            }
            emit(token.first);
            if (token.second) {
                emit(" ");
                emit(token.second);
                if (token.pop) {
                    emit("[]");
                }
                if (token.third) {
                    emit(" ");
                    emit(token.third);
                }
            }
        }
        if (token.statements) {
            emit_statements(token.statements);
            if (Array.isArray(token.else_if) && token.else_if.length > 0) {
                token.else_if.forEach(function else_if(clause) {
                    emit();
                    emit("else if ");
                    emit(clause.first);
                    emit_statements(clause.statements)
                })
            }
            if (Array.isArray(token.else) && token.else.length > 0) {
                emit();
                emit("else");
                emit_statements(token.else)
            }
        }
    }
}

function emit_statements(array) {
    indentation += 4;
    array.forEach(emit_statement);
    indentation -= 4;
}

function emit_tree(tree) {
    if (Array.isArray(tree)) {
        return tree.join(end_of_line);
    }
    emit(tree.misty);
    emit(" ");
    emit(tree.name);
    emit();
    tree.functions.forEach(function (func, function_nr) {
        emit("ƒ" + function_nr);
        emit(" ");
        if (func.name) {
            emit(func.name);
        }
        emit("(");
        emit(func.parameters);
        emit(")");
        emit_statements(func.statements);
        emit();
    });
}

function emit_extra(title, array) {
    if (array && array.length > 0) {
        indentation = 0;
        emit();
        emit(title);
        indentation = 4;
        emit();
        emit(array.sort());
        indentation = 0;
        emit();
    }
}

function errors_q(tree) {
    if (Array.isArray(tree)) {
        output_legend.replaceChildren("Errors");
        outputation.textContent = tree.join(end_of_line);
        return true;
    } else {
        return false;
    }
}

function process_tree() {
    inputation.focus();
    var tree = parse(tokenize(inputation.value));
    var object;
    if (errors_q(tree)) {
        return;
    }
    if (endowment_box.value === "") {
        object = {};
        tree.endowments.sort().forEach(
            function (value) {
                object[value] = false;
            }
        );
        endowment_box.value = JSON.stringify(object);
    }
    if (log_box.value === "") {
        object = {};
        tree.logs.sort().forEach(
            function (value) {
                object[value] = "allowed";
            }
        );
        log_box.value = JSON.stringify(object);
    }
    tree = slot(scope(tree, (
        endowment_box.value === ""
        ? ""
        : JSON.parse(endowment_box.value)
    ), (
        log_box.value === ""
        ? ""
        : JSON.parse(log_box.value)
    )));
    if (!errors_q(tree)) {
        return tree;
    }
}

(function initialize() {
    const inputation = document.getElementById("inputation");
    endowment_box = document.getElementById("endowments");
    log_box = document.getElementById("logs");
    const outputation = document.getElementById("outputation");
    const output_legend = document.getElementById("output_legend");
    const clear_element = document.getElementById("clear_button");
    const token_element = document.getElementById("token_button");
    const parse_element = document.getElementById("parse_button");
    const extra_element = document.getElementById("extra_button");
    const complete = document.getElementById("complete");
    const debug = document.getElementById("debugger");
    inputation.value = localStorage.getItem("source") || "misty program test() {\n}";
    inputation.addEventListener("input", function () {
        localStorage.setItem("source", inputation.value);
    });
    clear_element.addEventListener("click", function (event) {
        output_legend.replaceChildren("Watch this space");
        outputation.innerHTML = "";
        inputation.value = "";
        inputation.focus();
    });
    token_element.addEventListener("click", function (event) {
        outputation.textContent = "[\n" + tokenize(inputation.value).map(
            function (token) {
                return "    " + JSON.stringify(token, [
                    "error", "error_column", "error_row", "text", "kind",
                    "length", "indentation", "at", "from_column", "from_row",
                    "to_column", "to_row"
                ]);
            }
        ).join("\n") + "\n]";
        output_legend.replaceChildren("Tokens");
        inputation.focus();
    }, false);
    parse_element.addEventListener("click", function (event) {
        var tree = process_tree();
        if (tree) {
            output_legend.replaceChildren("Parse Tree");
            begin_emit();
            emit_tree(tree);
            outputation.textContent = end_emit();
        }
    }, false);
    extra_element.addEventListener("click", function (event) {
        var tree = process_tree();
        if (tree) {
            output_legend.replaceChildren("Extra");
            begin_emit();
            indentation = 0;
            emit("Scope");
            tree.scopes.forEach(function (scope, func_nr) {
                indentation = 4;
                emit();
                emit("ƒ" + func_nr);
                indentation = 8;
                emit();
                Object.keys(scope).sort().forEach(function (name) {
                    emit_full_name(scope[name]);
                    emit();
                });
            });
            emit_extra("Endowments", tree.endowments);
            emit_extra("Intrinsics", tree.intrinsics);
            emit_extra("Logs", tree.logs);
            emit_extra("Modules", tree.modules);
            outputation.textContent = end_emit();
        }
    }, false);
    complete.addEventListener("click", function (event) {
        var tree = process_tree();
        if (tree) {
            output_legend.replaceChildren("Complete");
            outputation.innerHTML = "";
            outputation.append(JSON.stringify(tree, null, 4));
        }
    }, false);
    function out_array(label, array) {
        if (Array.isArray(array)) {
            outputation.append(label + ": " + array.join(" ") + end_of_line);
        }
    }
    debug.addEventListener("click", function (event) {
        debugger;
    }, false);
    inputation.focus();
    inputation.select();
}());
</script>
</body>
</html>
